<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Important for phones -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Wild Shaale Speech</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 24px;
    }

    .question {
      background: #f1f5f1;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .question-label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    #transcript {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 14px;
      border: 2px solid #ccc;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.5;
      font-family: Arial, sans-serif;
    }

    #transcript:focus {
      outline: none;
      border-color: #555;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      min-height: 24px;
      font-weight: bold;
    }

    .recording {
      color: #c62828;
    }

    .ready {
      color: #2e7d32;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #2e7d32;
      color: white;
    }

    #stopBtn {
      background: #c62828;
      color: white;
    }

    #againBtn {
      background: #757575;
      color: white;
    }

    #useBtn {
      background: #1565c0;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info {
      margin-top: 15px;
      padding: 12px;
      background: #fff8e1;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎤 Wild Shaale Speech</h1>

  <div class="question">
    <div class="question-label">Question:</div>
    <div id="questionText">Loading...</div>
  </div>

  <textarea
    id="transcript"
    placeholder="Your spoken answer will appear here..."
  ></textarea>

  <div id="status" class="status">
    Ready to speak
  </div>

  <button id="startBtn">
    🎤 Start Speaking
  </button>

  <button id="stopBtn" disabled>
    ⏹ Stop
  </button>

  <button id="againBtn">
    🔄 Record Again
  </button>

  <button id="useBtn">
    ✅ Use This Answer
  </button>

  <div class="info">
    <b>How to use:</b><br>
    1. Tap <b>Start Speaking</b>.<br>
    2. Speak normally.<br>
    3. Tap <b>Stop</b> when finished.<br>
    4. Check and edit the text if needed.<br>
    5. Tap <b>Use This Answer</b>.
  </div>

</div>


<script>

  /* =========================================================
     GET QUESTION / TARGET FROM MAIN APPS SCRIPT PAGE
     ========================================================= */

  const params = new URLSearchParams(window.location.search);

  const target = params.get("target") || "";
  const question = params.get("question") || "";

  document.getElementById("questionText").textContent =
    question || "Speak your answer";


  /* =========================================================
     SPEECH RECOGNITION
     ========================================================= */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const transcriptBox =
    document.getElementById("transcript");

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const againBtn =
    document.getElementById("againBtn");

  const useBtn =
    document.getElementById("useBtn");

  const status =
    document.getElementById("status");


  let recognition = null;

  let isRecording = false;

  /*
   * We keep the final transcript ourselves.
   *
   * IMPORTANT:
   * We DO NOT append interim results.
   * This prevents the repeated-text problem on phones.
   */
  let finalTranscript = "";


  /* =========================================================
     CHECK BROWSER SUPPORT
     ========================================================= */

  if (!SpeechRecognition) {

    status.textContent =
      "❌ Speech recognition is not supported in this browser.";

    status.className = "status";

    startBtn.disabled = true;

  } else {

    setupRecognition();

  }


  /* =========================================================
     SETUP SPEECH RECOGNITION
     ========================================================= */

  function setupRecognition() {

    recognition = new SpeechRecognition();

    /*
     * IMPORTANT:
     *
     * continuous = false
     *
     * This is intentional.
     *
     * On mobile browsers, continuous recognition can produce
     * overlapping results and repeated sentences.
     */
    recognition.continuous = false;

    /*
     * We only need final results.
     */
    recognition.interimResults = false;

    /*
     * Indian English.
     */
    recognition.lang = "en-IN";

    /*
     * We want one clean result.
     */
    recognition.maxAlternatives = 1;


    /* =======================================================
       SPEECH RESULT
       ======================================================= */

    recognition.onresult = function(event) {

      let spokenText = "";

      /*
       * Read only final results.
       */
      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        if (event.results[i].isFinal) {

          const text =
            event.results[i][0].transcript.trim();

          if (text) {
            spokenText +=
              (spokenText ? " " : "") + text;
          }
        }
      }


      if (spokenText) {

        /*
         * Since we are NOT using continuous recognition,
         * this is a single final result.
         *
         * Replace the transcript rather than repeatedly
         * appending the same browser result.
         */
        finalTranscript = spokenText.trim();

        transcriptBox.value = finalTranscript;

        status.textContent =
          "✅ Speech captured. You can edit the answer.";

        status.className = "status ready";
      }

    };


    /* =======================================================
       START
       ======================================================= */

    recognition.onstart = function() {

      isRecording = true;

      startBtn.disabled = true;
      stopBtn.disabled = false;

      status.textContent =
        "🔴 Listening... Speak now.";

      status.className =
        "status recording";
    };


    /* =======================================================
       END
       ======================================================= */

    recognition.onend = function() {

      isRecording = false;

      startBtn.disabled = false;
      stopBtn.disabled = true;

      /*
       * Don't overwrite an existing answer.
       */
      if (transcriptBox.value.trim()) {

        status.textContent =
          "✅ Recording stopped. Check your answer.";

        status.className =
          "status ready";

      } else {

        status.textContent =
          "Ready to speak";

        status.className =
          "status";
      }

    };


    /* =======================================================
       ERROR
       ======================================================= */

    recognition.onerror = function(event) {

      isRecording = false;

      startBtn.disabled = false;
      stopBtn.disabled = true;

      let message = "Speech recognition error.";

      if (event.error === "not-allowed") {

        message =
          "❌ Microphone permission was denied. Please allow microphone access.";

      } else if (event.error === "no-speech") {

        message =
          "⚠️ No speech detected. Please try again.";

      } else if (event.error === "network") {

        message =
          "❌ Network error. Please check your internet connection.";

      } else if (event.error === "aborted") {

        message =
          "Recording stopped.";

      }

      status.textContent = message;

      status.className = "status";
    };

  }


  /* =========================================================
     START BUTTON
     ========================================================= */

  startBtn.addEventListener("click", function() {

    if (!recognition) {
      return;
    }

    /*
     * Clear previous recording before starting.
     */
    finalTranscript = "";

    transcriptBox.value = "";

    status.textContent =
      "Starting microphone...";

    status.className =
      "status";

    try {

      recognition.start();

    } catch (error) {

      /*
       * Some mobile browsers throw an error if start()
       * is called while recognition is already running.
       */
      console.log("Recognition start:", error);

    }

  });


  /* =========================================================
     STOP BUTTON
     ========================================================= */

  stopBtn.addEventListener("click", function() {

    if (!recognition) {
      return;
    }

    try {

      recognition.stop();

    } catch (error) {

      console.log("Recognition stop:", error);

    }

  });


  /* =========================================================
     RECORD AGAIN
     ========================================================= */

  againBtn.addEventListener("click", function() {

    /*
     * Completely clear the previous answer.
     */
    finalTranscript = "";

    transcriptBox.value = "";

    status.textContent =
      "Ready to record again.";

    status.className =
      "status";

    /*
     * Automatically start recording after pressing
     * Record Again.
     */
    if (recognition) {

      setTimeout(function() {

        try {

          recognition.start();

        } catch (error) {

          console.log("Recognition restart:", error);

        }

      }, 150);

    }

  });


  /* =========================================================
     USE THIS ANSWER
     ========================================================= */

  useBtn.addEventListener("click", function() {

    const answer =
      transcriptBox.value.trim();

    if (!answer) {

      status.textContent =
        "⚠️ Please record or type an answer first.";

      status.className =
        "status";

      return;
    }


    /*
     * Send the final edited answer back to the
     * Apps Script page.
     */
    if (window.opener) {

      window.opener.postMessage(
        {
          type: "wildShaaleSpeechResult",
          target: target,
          text: answer
        },
        "*"
      );

      status.textContent =
        "✅ Answer sent back to the form.";

      status.className =
        "status ready";


      /*
       * Give the message a moment to reach the
       * Apps Script page before closing.
       */
      setTimeout(function() {

        window.close();

      }, 300);

    } else {

      status.textContent =
        "⚠️ The main Wild Shaale form could not be found.";

    }

  });


  /* =========================================================
     PREVENT ACCIDENTAL PAGE CLOSING WHILE RECORDING
     ========================================================= */

  window.addEventListener("beforeunload", function(event) {

    if (isRecording) {

      event.preventDefault();
      event.returnValue = "";

    }

  });

</script>

</body>
</html>
