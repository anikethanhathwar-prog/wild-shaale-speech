<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wild Shaale Speech Input</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
      text-align: center;
      color: #176b3a;
    }

    .question {
      background: #eef7f0;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 18px;
      line-height: 1.45;
    }

    #status {
      text-align: center;
      font-weight: bold;
      margin: 18px 0;
      min-height: 24px;
    }

    #transcript {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #bbb;
      border-radius: 12px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 17px;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #176b3a;
      color: white;
    }

    #stopBtn {
      background: #b3261e;
      color: white;
      display: none;
    }

    #sendBtn {
      background: #176b3a;
      color: white;
      display: none;
    }

    #againBtn {
      background: #e6e6e6;
      color: #222;
      display: none;
    }

    .info {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 15px;
      line-height: 1.4;
    }

    .success {
      color: #176b3a;
    }

    .error {
      color: #b3261e;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎤 Speech Input</h1>

  <div id="question" class="question">
    Speak your answer below.
  </div>

  <div id="status">
    Ready
  </div>

  <textarea
    id="transcript"
    placeholder="Your spoken answer will appear here..."
  ></textarea>

  <button id="startBtn">
    🎤 Start Speaking
  </button>

  <button id="stopBtn">
    ⏹ Stop
  </button>

  <button id="againBtn">
    🔄 Record Again
  </button>

  <button id="sendBtn">
    ✅ Use This Answer
  </button>

  <div class="info">
    Speak clearly in English.<br>
    You can edit the answer before sending it.
  </div>

</div>

<script>

  const params = new URLSearchParams(window.location.search);

  const target = params.get("target") || "";

  const questionText =
    params.get("question") || "Speak your answer below.";

  const questionElement =
    document.getElementById("question");

  const statusElement =
    document.getElementById("status");

  const transcriptElement =
    document.getElementById("transcript");

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const againBtn =
    document.getElementById("againBtn");

  const sendBtn =
    document.getElementById("sendBtn");


  questionElement.textContent = questionText;


  // --------------------------------------------------
  // CHECK SPEECH RECOGNITION SUPPORT
  // --------------------------------------------------

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    statusElement.textContent =
      "❌ Speech recognition is not supported in this browser.";

    statusElement.className = "error";

    startBtn.disabled = true;

  }


  let recognition = null;

  let finalTranscript = "";

  let isRecording = false;


  // --------------------------------------------------
  // START RECOGNITION
  // --------------------------------------------------

  function startRecognition() {

    if (!SpeechRecognition) {
      return;
    }

    finalTranscript = "";

    transcriptElement.value = "";

    recognition =
      new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = true;

    recognition.interimResults = true;

    recognition.maxAlternatives = 1;


    recognition.onstart = function() {

      isRecording = true;

      statusElement.textContent =
        "🎤 Listening... Speak now";

      statusElement.className = "";

      startBtn.style.display = "none";

      stopBtn.style.display = "block";

      againBtn.style.display = "none";

      sendBtn.style.display = "none";
    };


    recognition.onresult = function(event) {

      let interimTranscript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0].transcript;

        if (event.results[i].isFinal) {

          finalTranscript += transcript + " ";

        } else {

          interimTranscript += transcript;

        }
      }

      transcriptElement.value =
        finalTranscript + interimTranscript;
    };


    recognition.onerror = function(event) {

      console.error(
        "Speech recognition error:",
        event.error
      );

      isRecording = false;

      stopBtn.style.display = "none";

      startBtn.style.display = "block";

      if (event.error === "not-allowed") {

        statusElement.textContent =
          "❌ Microphone permission was denied.";

      } else if (event.error === "no-speech") {

        statusElement.textContent =
          "⚠️ No speech detected. Please try again.";

      } else {

        statusElement.textContent =
          "❌ Speech recognition error: " +
          event.error;
      }

      statusElement.className = "error";
    };


    recognition.onend = function() {

      isRecording = false;

      stopBtn.style.display = "none";

      startBtn.style.display = "block";

      againBtn.style.display = "block";

      sendBtn.style.display = "block";

      statusElement.textContent =
        "✓ Recording stopped. Check your answer.";

      statusElement.className = "success";
    };


    try {

      recognition.start();

    } catch (error) {

      console.error(error);

      statusElement.textContent =
        "❌ Could not start microphone.";

      statusElement.className = "error";
    }

  }


  // --------------------------------------------------
  // STOP
  // --------------------------------------------------

  function stopRecognition() {

    if (recognition && isRecording) {

      recognition.stop();

    }

  }


  // --------------------------------------------------
  // RECORD AGAIN
  // --------------------------------------------------

  function recordAgain() {

    transcriptElement.value = "";

    finalTranscript = "";

    statusElement.textContent =
      "Ready";

    statusElement.className = "";

    startBtn.style.display = "block";

    stopBtn.style.display = "none";

    againBtn.style.display = "none";

    sendBtn.style.display = "none";
  }


  // --------------------------------------------------
  // SEND TEXT BACK TO APPS SCRIPT
  // --------------------------------------------------

  function sendAnswer() {

    const text =
      transcriptElement.value.trim();

    if (!text) {

      statusElement.textContent =
        "⚠️ Please speak or enter an answer first.";

      statusElement.className = "error";

      return;
    }


    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type: "wildShaaleSpeechResult",

          target: target,

          text: text
        },

        "*"
      );


      statusElement.textContent =
        "✓ Answer sent. You can close this window.";

      statusElement.className =
        "success";


      sendBtn.textContent =
        "✓ Answer Sent";


      sendBtn.disabled = true;


      setTimeout(function() {

        window.close();

      }, 700);

    } else {

      statusElement.textContent =
        "❌ The main Wild Shaale form is not available.";

      statusElement.className =
        "error";
    }

  }


  // --------------------------------------------------
  // BUTTON EVENTS
  // --------------------------------------------------

  startBtn.addEventListener(
    "click",
    startRecognition
  );

  stopBtn.addEventListener(
    "click",
    stopRecognition
  );

  againBtn.addEventListener(
    "click",
    recordAgain
  );

  sendBtn.addEventListener(
    "click",
    sendAnswer
  );

</script>

</body>
</html>
